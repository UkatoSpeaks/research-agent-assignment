<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>

  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">ResearchPilot — Agent Architecture</text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#718096">CLI goal in -&gt; LangGraph state machine -&gt; structured report out</text>

  <!-- CLI -->
  <rect x="470" y="80" width="240" height="46" rx="8" fill="#2d3748"/>
  <text x="590" y="108" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">CLI (app/main.py)</text>

  <!-- START -->
  <circle cx="590" cy="160" r="14" fill="#4a5568"/>
  <text x="590" y="164" text-anchor="middle" font-size="10" fill="#fff">START</text>
  <line x1="590" y1="126" x2="590" y2="146" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Planner -->
  <rect x="470" y="190" width="240" height="56" rx="8" fill="#2b6cb0"/>
  <text x="590" y="213" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Planner Agent</text>
  <text x="590" y="230" text-anchor="middle" font-size="11" fill="#dbeafe">Groq LLM -&gt; ExecutionPlan (steps)</text>
  <line x1="590" y1="174" x2="590" y2="190" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Executor -->
  <rect x="470" y="280" width="240" height="56" rx="8" fill="#2f855a"/>
  <text x="590" y="303" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Executor Agent</text>
  <text x="590" y="320" text-anchor="middle" font-size="11" fill="#d1fae5">runs current step's tool</text>
  <line x1="590" y1="246" x2="590" y2="280" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tools row -->
  <rect x="60" y="380" width="150" height="50" rx="8" fill="#805ad5"/>
  <text x="135" y="410" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">web_search</text>

  <rect x="230" y="380" width="150" height="50" rx="8" fill="#805ad5"/>
  <text x="305" y="410" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">page_fetcher</text>

  <rect x="400" y="380" width="150" height="50" rx="8" fill="#805ad5"/>
  <text x="475" y="410" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">calculator</text>

  <line x1="470" y1="308" x2="210" y2="380" stroke="#805ad5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="308" x2="305" y2="380" stroke="#805ad5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="308" x2="475" y2="380" stroke="#805ad5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="365" text-anchor="middle" font-size="10" fill="#805ad5">selects tool by step.tool</text>

  <!-- Validator -->
  <rect x="470" y="450" width="240" height="56" rx="8" fill="#c05621"/>
  <text x="590" y="473" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Validator Agent</text>
  <text x="590" y="490" text-anchor="middle" font-size="11" fill="#feebc8">checks ToolResult.success</text>
  <line x1="590" y1="336" x2="590" y2="450" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recovery -->
  <rect x="820" y="450" width="240" height="56" rx="8" fill="#c0392b"/>
  <text x="940" y="473" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Recovery Agent</text>
  <text x="940" y="490" text-anchor="middle" font-size="11" fill="#fde8e6">logs RecoveryEvent, retry &lt; 2</text>

  <line x1="710" y1="470" x2="820" y2="470" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="765" y="460" text-anchor="middle" font-size="10" fill="#c0392b">validation_failed</text>

  <!-- Recovery back to executor (retry) -->
  <path d="M 940 450 C 940 340 720 300 710 300" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="960" y="360" font-size="10" fill="#c0392b">retry</text>

  <!-- Advance -->
  <rect x="190" y="450" width="240" height="56" rx="8" fill="#2b6cb0"/>
  <text x="310" y="473" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Advance Node</text>
  <text x="310" y="490" text-anchor="middle" font-size="11" fill="#dbeafe">current_step += 1</text>

  <line x1="470" y1="470" x2="430" y2="470" stroke="#2f855a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="460" text-anchor="middle" font-size="10" fill="#2f855a">validated</text>

  <path d="M 310 450 C 310 340 470 300 470 300" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="360" font-size="10" fill="#2b6cb0">next step</text>

  <!-- Reporter -->
  <rect x="470" y="560" width="240" height="56" rx="8" fill="#2c7a7b"/>
  <text x="590" y="583" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">Reporter Agent</text>
  <text x="590" y="600" text-anchor="middle" font-size="11" fill="#d1f7f5">Groq LLM -&gt; FinalReport</text>

  <line x1="590" y1="506" x2="590" y2="560" stroke="#2f855a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="530" font-size="10" fill="#2f855a">all steps complete</text>

  <line x1="940" y1="506" x2="700" y2="580" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="850" y="555" font-size="10" fill="#c0392b">max retries reached</text>

  <!-- END -->
  <circle cx="590" cy="660" r="14" fill="#4a5568"/>
  <text x="590" y="664" text-anchor="middle" font-size="10" fill="#fff">END</text>
  <line x1="590" y1="616" x2="590" y2="646" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="440" y="700" width="300" height="56" rx="8" fill="#2d3748"/>
  <text x="590" y="723" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">CLI output</text>
  <text x="590" y="740" text-anchor="middle" font-size="11" fill="#cbd5e0">console trace, JSON, Markdown, transcript</text>
  <line x1="590" y1="674" x2="590" y2="700" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="60" y="800" width="1060" height="80" rx="8" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="80" y="822" font-size="12" font-weight="600" fill="#1a202c">Shared state (AgentState): goal, plan, current_step, tool_results, errors, recovery_events, retry_count, execution_log, final_report, status</text>
  <text x="80" y="844" font-size="11" fill="#4a5568">Blue = planning / progression &#183; Green = tool execution &#183; Purple = tools &#183; Orange = validation &#183; Red = failure / recovery path &#183; Teal = reporting</text>
  <text x="80" y="864" font-size="11" fill="#4a5568">Failure injection: --force-failure fails the first tool call on purpose so the validator -&gt; recovery -&gt; retry path is exercised end-to-end.</text>
</svg>
